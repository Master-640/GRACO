# Spin-glass / Ising ground-state search on a 3D periodic lattice with N(0,1)
# couplings (DIRAC lineage): structure2vec node<->edge encoder + n-step DQN,
# reward = ΔH / |E|, bootstrap clipped at 0 (DIRAC-specific).
base: base.yaml

run_name: spinglass_dirac

generator:
  type: lattice
  dim: 3
  periodic: true
  num_nodes: [64, 64]      # ~4x4x4 lattice (side rounded from n)
  weighted: true
  weight_dist: normal
  weight_params: {mean: 0.0, std: 1.0}

env:
  type: spinglass

algo:
  type: dqn
  n_step: 3
  gamma: 1.0
  double: false
  bootstrap_clip_min: 0.0    # DIRAC clips the bootstrap term at >= 0
  eps_decay_steps: 50000
  model:
    encoder:
      type: s2v
      hidden_dim: 64
      num_layers: 5
      norm: l2
    head:
      type: q_node
  buffer:
    type: nstep_replay
    capacity: 50000

trainer:
  num_envs: 16
  iterations: 3000
  baselines: [random]
