# Hypergraph dismantling with a hypergraph GNN (HGNN over node<->hyperedge
# incidence). The hypergraph generator also emits a clique-expanded topology,
# so the env's connectivity/reward operate on the ordinary edges.
base: base.yaml
run_name: dismantling_hypergraph
generator: {type: hypergraph, num_nodes: [30, 50], num_hyperedges: 20, hyperedge_size: 3}
env: {type: dismantling}
algo:
  type: dqn
  n_step: 5
  double: true
  model:
    encoder: {type: hgnn, hidden_dim: 64, num_layers: 3}
    head: {type: q_node}
trainer: {num_envs: 16, iterations: 3000, baselines: [degree, random]}
